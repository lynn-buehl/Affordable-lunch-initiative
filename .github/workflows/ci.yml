name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the app can be built; no real services are contacted.
      DATABASE_URL: postgresql://ali:ali@localhost:5432/ali
      AUTH_SECRET: ci-only-not-a-real-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
